<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Snacks</title>
<style>
  :root { --teal: #8ABDB5; --teal-bright: #b7e3db; --ink: #eaf2f0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05060f; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #sky { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

  .hud { position: fixed; z-index: 10; color: var(--ink); pointer-events: none; user-select: none; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
  .top-left  { top: 20px; left: 22px; }
  .title { font-size: 19px; letter-spacing: .04em; font-weight: 600; }
  .title .dot { color: var(--teal-bright); }
  .sub { font-size: 12.5px; color: #9fb4b0; margin-top: 4px; letter-spacing: .02em; }
  .count { font-size: 13px; color: var(--teal-bright); margin-top: 10px; letter-spacing: .06em; }

  .controls { position: fixed; z-index: 10; top: 18px; right: 18px; display: flex; gap: 8px; }
  .btn { pointer-events: auto; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ink);
    background: rgba(138,189,181,.08); border: 1px solid rgba(138,189,181,.28); border-radius: 999px;
    padding: 7px 14px; backdrop-filter: blur(6px); transition: background .18s, border-color .18s; }
  .btn:hover { background: rgba(138,189,181,.18); border-color: var(--teal); }
  .btn:active { transform: translateY(1px); }

  .hint { position: fixed; z-index: 10; left: 50%; bottom: 26px; transform: translateX(-50%);
    color: #7f9691; font-size: 12.5px; letter-spacing: .04em; pointer-events: none; user-select: none;
    transition: opacity .8s ease; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="hud top-left">
  <div class="title">Star Snacks<span class="dot"> ·</span></div>
  <div class="sub">Tap anywhere to scatter stardust</div>
  <div class="count" id="count">fed 0</div>
</div>

<div class="controls">
  <button class="btn" id="addBtn">+ critter</button>
  <button class="btn" id="soundBtn">sound: on</button>
</div>

<div class="hint" id="hint">click &amp; drag to feed the swarm</div>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const countEl = document.getElementById('count');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  // ---- Starfield (3 parallax layers) ----
  const stars = [];
  function seedStars() {
    stars.length = 0;
    const n = Math.round(W * H / 5200);
    for (let i = 0; i < n; i++) {
      const layer = Math.floor(rand(0, 3));
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rand(0.4, 1.5) + layer * 0.4,
        z: layer, tw: Math.random() * TAU, sp: rand(0.6, 2.2),
        drift: (layer + 1) * 0.04
      });
    }
  }
  seedStars();
  window.addEventListener('resize', seedStars);

  // ---- Nebula blobs ----
  const nebulae = [
    { hue: 275, x: 0.28, y: 0.35, r: 0.55, a: 0.16, ph: 0 },
    { hue: 190, x: 0.72, y: 0.62, r: 0.5, a: 0.13, ph: 2 },
    { hue: 320, x: 0.55, y: 0.15, r: 0.4, a: 0.10, ph: 4 },
  ];

  // ---- Food (stardust pellets) ----
  const foods = [];
  function addFood(x, y, spread) {
    if (foods.length > 260) return;
    foods.push({
      x, y,
      vx: rand(-spread, spread), vy: rand(-spread, spread) + 0.15,
      r: rand(3.2, 5.2), life: 1, hue: rand(38, 52), ph: Math.random() * TAU
    });
  }

  // ---- Particles (eat bursts) ----
  const parts = [];
  function burst(x, y, hue) {
    const n = 10 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(0.6, 3.2);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: rand(1, 2.6), hue });
    }
  }

  // ---- Critters ----
  const critters = [];
  function addCritter(x, y) {
    critters.push({
      x: x ?? Math.random() * W, y: y ?? Math.random() * H,
      vx: rand(-1, 1), vy: rand(-1, 1),
      size: rand(8, 12), baseSize: 0, hue: rand(150, 205),
      wander: Math.random() * TAU, wob: Math.random() * TAU,
      flash: 0, trail: [], full: 0
    });
    const c = critters[critters.length - 1];
    c.baseSize = c.size;
  }
  for (let i = 0; i < 6; i++) addCritter();

  let fed = 0;

  // ---- Sound (gentle, opt-out) ----
  let soundOn = true, actx = null;
  function ensureAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } } }
  function blip(freq, dur, vol) {
    if (!soundOn || !actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime);
    g.gain.linearRampToValueAtTime(vol, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  }

  // ---- Shooting stars ----
  let shooter = null, nextShoot = rand(4, 9);

  // ---- Input ----
  let pointerDown = false, px = 0, py = 0, dragAcc = 0;
  function toXY(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function down(e) {
    ensureAudio();
    pointerDown = true;
    const p = toXY(e); px = p.x; py = p.y;
    for (let i = 0; i < 5; i++) addFood(px, py, 1.4);
    blip(rand(520, 620), 0.12, 0.05);
    hideHint();
    e.preventDefault();
  }
  function move(e) {
    if (!pointerDown) return;
    const p = toXY(e); px = p.x; py = p.y;
    dragAcc += 1;
    if (dragAcc % 3 === 0) addFood(px, py, 0.8);
    e.preventDefault();
  }
  function up() { pointerDown = false; }
  cv.addEventListener('mousedown', down);
  cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down, { passive: false });
  cv.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);

  let hintHidden = false;
  function hideHint() { if (!hintHidden) { hintHidden = true; hintEl.style.opacity = '0'; } }

  document.getElementById('addBtn').addEventListener('click', () => { addCritter(); });
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; soundBtn.textContent = 'sound: ' + (soundOn ? 'on' : 'off'); if (soundOn) ensureAudio(); });

  // ---- Loop ----
  let t = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.67, 2.2); last = now; t += dt * 0.016;

    // background
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070a1a'); g.addColorStop(0.6, '#05060f'); g.addColorStop(1, '#0a0713');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // nebulae
    ctx.globalCompositeOperation = 'lighter';
    for (const nb of nebulae) {
      const cx = (nb.x + Math.sin(t * 0.15 + nb.ph) * 0.03) * W;
      const cy = (nb.y + Math.cos(t * 0.12 + nb.ph) * 0.03) * H;
      const rr = nb.r * Math.min(W, H);
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      rg.addColorStop(0, `hsla(${nb.hue},70%,60%,${nb.a})`);
      rg.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';

    // stars
    for (const s of stars) {
      s.x -= s.drift * dt; if (s.x < 0) s.x += W;
      const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.tw);
      ctx.globalAlpha = tw;
      ctx.fillStyle = s.z === 2 ? '#dff3ff' : '#eaf2f0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // shooting star
    nextShoot -= dt * 0.016;
    if (!shooter && nextShoot <= 0) {
      const edge = Math.random() < 0.5;
      shooter = { x: rand(0, W), y: edge ? -20 : rand(0, H * 0.4), vx: rand(4, 8), vy: rand(3, 6), life: 1 };
      nextShoot = rand(5, 12);
    }
    if (shooter) {
      shooter.x += shooter.vx * dt * 2.4; shooter.y += shooter.vy * dt * 2.4; shooter.life -= 0.012 * dt;
      ctx.globalCompositeOperation = 'lighter';
      const tx = shooter.x - shooter.vx * 9, ty = shooter.y - shooter.vy * 9;
      const lg = ctx.createLinearGradient(tx, ty, shooter.x, shooter.y);
      lg.addColorStop(0, 'rgba(183,227,219,0)'); lg.addColorStop(1, `rgba(220,243,255,${Math.max(0, shooter.life)})`);
      ctx.strokeStyle = lg; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(shooter.x, shooter.y); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      if (shooter.life <= 0 || shooter.x > W + 40 || shooter.y > H + 40) shooter = null;
    }

    // food
    ctx.globalCompositeOperation = 'lighter';
    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i];
      f.vx *= 0.985; f.vy *= 0.985; f.vy += 0.008 * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.ph += 0.1 * dt;
      if (f.x < 0 || f.x > W) f.vx *= -0.7;
      if (f.y > H - 4) { f.vy *= -0.5; f.y = H - 4; }
      f.life -= 0.0011 * dt;
      if (f.life <= 0) { foods.splice(i, 1); continue; }
      const pulse = 0.75 + 0.25 * Math.sin(f.ph);
      const rr = f.r * (2.8 + pulse);
      const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr);
      rg.addColorStop(0, `hsla(${f.hue},100%,72%,${0.9 * f.life})`);
      rg.addColorStop(0.4, `hsla(${f.hue},100%,60%,${0.35 * f.life})`);
      rg.addColorStop(1, 'hsla(45,100%,60%,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(f.x, f.y, rr, 0, TAU); ctx.fill();
      ctx.fillStyle = `hsla(50,100%,92%,${f.life})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * pulse * 0.6, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // critters
    for (const c of critters) {
      // find nearest food
      let target = null, best = 260 * 260;
      for (const f of foods) {
        const dx = f.x - c.x, dy = f.y - c.y, d2 = dx * dx + dy * dy;
        if (d2 < best) { best = d2; target = f; }
      }
      if (target) {
        const dx = target.x - c.x, dy = target.y - c.y, d = Math.hypot(dx, dy) || 1;
        c.vx += (dx / d) * 0.14 * dt; c.vy += (dy / d) * 0.14 * dt;
        if (d < c.size + target.r + 2) {
          const idx = foods.indexOf(target);
          if (idx >= 0) foods.splice(idx, 1);
          fed++; countEl.textContent = 'fed ' + fed;
          burst(target.x, target.y, target.hue);
          c.flash = 1; c.full = Math.min(c.full + 1, 30);
          c.size = c.baseSize + Math.min(c.full * 0.12, 3.6);
          blip(660 + Math.random() * 120, 0.14, 0.06);
        }
      } else {
        // wander
        c.wander += rand(-0.3, 0.3) * dt;
        c.vx += Math.cos(c.wander) * 0.03 * dt; c.vy += Math.sin(c.wander) * 0.03 * dt;
      }
      // limit speed
      const sp = Math.hypot(c.vx, c.vy), max = target ? 3.4 : 1.7;
      if (sp > max) { c.vx = c.vx / sp * max; c.vy = c.vy / sp * max; }
      c.vx *= 0.99; c.vy *= 0.99;
      c.x += c.vx * dt; c.y += c.vy * dt;
      // wrap
      const m = c.size + 20;
      if (c.x < -m) c.x = W + m; if (c.x > W + m) c.x = -m;
      if (c.y < -m) c.y = H + m; if (c.y > H + m) c.y = -m;

      c.wob += 0.2 * dt; c.flash *= Math.pow(0.9, dt);
      c.trail.push({ x: c.x, y: c.y }); if (c.trail.length > 14) c.trail.shift();

      const ang = Math.atan2(c.vy, c.vx);

      // trail glow
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < c.trail.length; i++) {
        const p = c.trail[i], a = (i / c.trail.length);
        ctx.fillStyle = `hsla(${c.hue},80%,65%,${a * 0.12})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, c.size * (0.4 + a * 0.5), 0, TAU); ctx.fill();
      }
      // aura
      const auraR = c.size * (3 + c.flash * 1.5);
      const ag = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, auraR);
      ag.addColorStop(0, `hsla(${c.hue},85%,70%,${0.28 + c.flash * 0.4})`);
      ag.addColorStop(1, `hsla(${c.hue},85%,60%,0)`);
      ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(c.x, c.y, auraR, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      // body
      ctx.save();
      ctx.translate(c.x, c.y); ctx.rotate(ang);
      // tail
      const wag = Math.sin(c.wob) * 0.6;
      ctx.fillStyle = `hsla(${c.hue},70%,60%,0.85)`;
      ctx.beginPath();
      ctx.moveTo(-c.size * 0.6, 0);
      ctx.quadraticCurveTo(-c.size * 1.5, wag * c.size, -c.size * 1.9, wag * c.size * 1.6);
      ctx.quadraticCurveTo(-c.size * 1.3, 0, -c.size * 1.9, -wag * c.size * 1.6);
      ctx.quadraticCurveTo(-c.size * 1.5, -wag * c.size, -c.size * 0.6, 0);
      ctx.fill();
      // body
      const bg = ctx.createRadialGradient(-c.size * 0.2, -c.size * 0.2, c.size * 0.2, 0, 0, c.size);
      bg.addColorStop(0, `hsl(${c.hue},90%,${78 + c.flash * 15}%)`);
      bg.addColorStop(1, `hsl(${c.hue},75%,52%)`);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, 0, c.size, c.size * 0.82, 0, 0, TAU); ctx.fill();
      // eyes (face forward)
      ctx.fillStyle = '#fff';
      const ex = c.size * 0.42, ey = c.size * 0.28, er = c.size * 0.2;
      ctx.beginPath(); ctx.arc(ex, -ey, er, 0, TAU); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0a1f1c';
      ctx.beginPath(); ctx.arc(ex + er * 0.35, -ey, er * 0.5, 0, TAU); ctx.arc(ex + er * 0.35, ey, er * 0.5, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // particles
    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= 0.03 * dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${p.hue},100%,72%,${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
