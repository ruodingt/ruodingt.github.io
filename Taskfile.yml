version: '3'

tasks:
  install:
    desc: Install Ruby gem dependencies
    cmds:
      # Install into vendor/bundle rather than the system Ruby gem dir.
      # macOS ships Ruby under /Library/Ruby, which is not writable without
      # root, so a plain `bundle install` fails with a PermissionError.
      # Writes .bundle/config, which is gitignored; CI sets its own path.
      - bundle config set --local path vendor/bundle
      - bundle install

  serve:
    desc: Run the local dev server with live reload at http://localhost:4000
    cmds:
      - bundle exec jekyll serve --livereload

  build:
    desc: Build the static site into _site/
    cmds:
      - bundle exec jekyll build

  clean:
    desc: Remove build output and Jekyll cache
    cmds:
      - rm -rf _site .jekyll-cache .sass-cache
