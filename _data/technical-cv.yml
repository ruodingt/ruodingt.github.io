statement:
  - "I work across ML, data engineering, platform, product, and designing resilient event-driven systems — not because I lack focus, but because the problems that need to be solved rarely sit inside one boundary. At ANZ Plus I co-authored the bank's position paper on responsible AI experiments and drove the platform patterns teams now start from. At three startups I took systems from first prototype to production, built the teams around them, and closed the resource gaps a small organisation cannot fill on its own. I lead by providing context and perspective, so the people around me can make informed decisions and grow on their own terms. Growth, for me, is about both competence and character. I take initiative and drive problems to resolution, regardless of where they sit. I care about the decisions behind the system as much as the system itself — I look past the tree to see the forest. Tech is just one part of a commercial engine with complex dynamics, and the way forward is to remove friction, not to promote harder."

