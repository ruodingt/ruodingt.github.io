# The Observership CV guide calls this the most important section: 200-300
# words, at the top, covering who you are, professional value, community
# connection, and values/motivation.
statement:
  - "I came to Melbourne from Beijing in 2017 to study data science. Arriving without a local network, and building a career and a life here, taught me how much depends on the systems that make room for newcomers &mdash; and how easily someone falls outside them. Working in two languages every day, I tend to notice whose voice is missing from a room."
  - "Since then I have taken AI and data initiatives from ambiguity through to production: in a regulated bank, in a scale-up, and as founding engineer of a health-technology startup. I am usually the person who gives an ill-defined problem structure &mdash; leading a squad, acting as incident commander when systems fail, or setting the standards a team works to. I have learned to be sceptical of technology presented as inevitable, and to ask what a system does to the people at the far end of it."
  - "The causes that hold me are ones where a system quietly fails the people it was meant to serve. Pearlii set out to become a social enterprise addressing oral health poverty; Looksi is building infrastructure so banks can look after home loan customers they cannot serve today. Fifteen years ago I helped run a summer camp in Shangri-La introducing young people to Chinese cultural traditions and Tibetan Buddhist scholarship &mdash; seed-planting work, widening their sense of what a life could look like. I mentor engineers and teach AI to non-specialists, because putting technical risk into plain language is a governance skill rather than a courtesy. I want to be an Observer to learn how boards genuinely reach decisions, and to be useful where the gap is &mdash; I would rather find the gap than wait to be handed one. In time I would like to serve as a director."

# The guide asks for up to four, translated into what a board needs.
