# The Observership CV guide calls this the most important section: 200-300
# words, at the top, covering who you are, professional value, community
# connection, and values/motivation.
statement:
  - "Growing up in south-east China, I studied opto-electronics engineering in Beijing, then came to Melbourne in 2016 for a master's in deep learning, statistics and computer science. Arriving without a local network taught me how much depends on systems that make room for newcomers. Since then I have been taking AI and data work from ambiguity to a working system: in a regulated bank, and at three early-stage startups, twice as the founding engineer. I turn vague problems into something a team can act on, with real care for trust and for the nuanced chemistry between people and technology. I see technology as one part of a bigger system, and I ask about the whys beneath what is presented as inevitable. In a boardroom that is the same work one layer up: saying plainly what AI will and will not do, and what it would cost to be wrong."
  - "My community work has been in youth development: a summer school in Shangri-La, first as a participant and later as staff, and volunteer recruiting for a youth space. I also mentor engineers and teach AI to non-specialists, because putting technical risk into plain language is a governance skill, not a courtesy. My interests run to East Asian art and culture, and agribusiness. What drives me is leaving a system one percent better, in a way that keeps working after I have moved on. I want to be an Observer to learn how boards reach decisions, and in time to serve as a director."

