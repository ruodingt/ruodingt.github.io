# The Observership CV guide calls this the most important section: 200-300
# words, at the top, covering who you are, professional value, community
# connection, and values/motivation.
statement:
  - "I grew up in south-east China, studied engineering in Beijing, and came to Melbourne in 2017 for a master's in data science. Moving twice, the second time without a local network, taught me how much depends on the systems that make room for newcomers &mdash; and how easily someone falls outside them. Since then I have taken AI and data initiatives from ambiguity through to production: in a regulated bank, in a scale-up, and as founding engineer of two startups. I am usually the person who gives an ill-defined problem structure, and I have learned to be sceptical of technology presented as inevitable &mdash; to ask what a system does to the people at the far end of it."
  - "The causes that hold me are ones where a system quietly fails the people it was meant to serve. Pearlii set out to address oral health poverty; Looksi is building infrastructure so banks can look after home loan customers they cannot serve today. Fifteen years ago I helped run a summer camp in Shangri-La, widening young people's sense of what a life could look like. I mentor engineers and teach AI to non-specialists, because putting technical risk into plain language is a governance skill rather than a courtesy. I want to be an Observer to learn how boards genuinely reach decisions, and to be useful where the gap is. In time I would like to serve as a director."

# The guide asks for up to four, translated into what a board needs.
