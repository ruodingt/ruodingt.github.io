# The Observership CV guide calls this the most important section: 200-300
# words, at the top, covering who you are, professional value, community
# connection, and values/motivation.
statement:
  - "I grew up in south-east China and came to Melbourne for a master's in data science. Arriving in 2016 without a local network, I learned to build one from nothing &mdash; the same instinct I have used since to bring organisations the people and expertise they could not hire. My career has focused on taking AI and data from ambiguity to a working system, in a regulated bank and at three early-stage startups, twice as the founding engineer. At ANZ Plus that meant sitting on a technology committee and co-authoring its position paper on running machine-learning experiments within the bank's regulatory obligations &mdash; the pattern teams now start from. Working alongside risk and legal there taught me to ask what the exposure is, and who answers for it. At startup scale it has meant the commercial side too: preparing investor material, and building the operations a small team runs on. I turn vague problems into something a team can act on, mindful of trust and of the people the technology reaches. I see technology as one part of a bigger system, and I test the assumptions behind what is sold as inevitable."
  - "My community work has been in youth development: a summer school in Shangri-La, first as a participant and later as staff, and volunteer recruiting for a youth space. I also mentor engineers and teach AI to non-specialists. I hope to contribute something that lasts: a system made one percent better, or something new that keeps evolving on its own. I want to be an Observer to learn how boards reach decisions, and in time to serve as a director."

