statement:
  - "I grew up in south-east China, studied engineering in Beijing, and came to Melbourne in 2016 for a master's in data science. Moving twice, the second time without a local network, taught me how much depends on systems that make room for newcomers. Since then I have taken AI and data work from ambiguity to production: in a regulated bank, and at three early-stage startups, twice as the founding engineer. I turn vague problems into something a team can act on. I am also sceptical of technology presented as inevitable, and I ask what a system does to the people at the far end of it."
  - "I am drawn to places where a system quietly fails the people it was meant to serve. Pearlii offered a free tooth check to people who put off the dentist on cost. Looksi builds for home loan customers banks cannot serve today. I helped run a summer school in Shangri-La, widening young people's sense of what a life could look like. I mentor engineers and teach AI to non-specialists, because putting technical risk into plain language is a governance skill, not a courtesy. I want to be an Observer, to learn how boards decide. What I can bring is what boards are shortest of: someone who says plainly what AI will and will not do, and what it costs to be wrong. In time I would like to serve as a director."

