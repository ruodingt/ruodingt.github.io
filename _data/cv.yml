# connection, and values/motivation.
statement:
  - "I grew up in south-east China, studied engineering in Beijing, and came to Melbourne in 2017 for a master's in data science. Moving twice, the second time without a local network, taught me how much depends on the systems that make room for newcomers &mdash; and how easily someone falls outside them. Since then I have taken AI and data work from ambiguity to production in a regulated bank, a scale-up, and as founding engineer at two startups. I am usually the person who turns a vague problem into something a team can actually act on. I am also sceptical of technology presented as inevitable, and tend to ask what a system does to the people at the far end of it."
  - "The causes that hold me are ones where a system quietly fails the people it was meant to serve &mdash; Pearlii on oral health poverty, Looksi on home loan customers banks cannot serve today. Fifteen years ago I helped run a summer school in Shangri-La, widening young people's sense of what a life could look like. I mentor engineers and teach AI to non-specialists, because putting technical risk into plain language is a governance skill, not a courtesy. I want to be an Observer to learn how boards reach decisions, and to be useful where the gap is. In time I would like to serve as a director."

