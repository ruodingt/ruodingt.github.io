<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Apply the saved theme + accent before first paint so there's no flash.
       No choice stored = follow the OS (prefers-color-scheme). */
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('theme');
        var a = localStorage.getItem('accent');
        if (t) d.setAttribute('data-theme', t);
        if (a) d.setAttribute('data-accent', a);
      } catch (e) {}
    })();
  </script>
  {% seo %}
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1013" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% if page.url == '/' or page.layout == 'cv' %}{% include schema-person.html %}{% endif %}
</head>
<body>
  {% include header.html %}
  <main class="page">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
