<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title_override %}{{ page.title_override }}{% else %}{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  {% include header.html %}
  <main class="page">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
