title: "Rod (Ruoding) Tian"
tagline: "AI and data engineering, and writing"
email: t.ruoding@gmail.com
description: "Rod (Ruoding) Tian — engineer in Melbourne. AI and data from ambiguity to production, and writing on art, books, and the systems people live inside."
baseurl: ""
url: "https://ruodingt.github.io"
lang: en

# Used by jekyll-seo-tag for Open Graph, Twitter Cards, and JSON-LD.
author:
  name: "Rod (Ruoding) Tian"
logo: /assets/img/headshot.jpg
# social.links becomes schema.org sameAs — the verified profiles that tie this
# site to the same real person. Add more (X, Medium, ORCID, …) as they exist.
social:
  name: "Rod (Ruoding) Tian"
  links:
    - https://github.com/ruodingt
    - https://www.linkedin.com/in/ruodingt-tian/

# Feeds the richer Person JSON-LD in _includes/schema-person.html.
person:
  job_title: "Founding Engineer"
  works_for: "Looksi"
  works_for_url: "https://looksi.io"
  locality: "Melbourne"
  region: "VIC"
  country: "AU"
  knows_language:
    - "en"
    - "zh"
  knows_about:
    - "Artificial Intelligence"
    - "Machine Learning"
    - "Data Engineering"
    - "MLOps"
    - "Data Science"

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social preview image for pages that don't set their own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/headshot.jpg

exclude:
  - Gemfile
  - Gemfile.lock
  - Taskfile.yml
  - docs/
  - README.md
  - vendor/
  - ruvector.db
  - agentdb.rvf
  - agentdb.rvf.lock
  - .claude-flow/
  - .superpowers/
